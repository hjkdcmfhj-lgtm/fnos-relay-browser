name: Release fpk

# 推送 v* tag 时：多架构构建镜像到 GHCR（与仓库同名免密）
# 使用：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号（去掉 v 前缀）
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_BASE }}:latest

      - name: 输出提示
        run: |
          echo "镜像已推送：${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}"
          echo "请将该地址填入 scripts/fpk/relay-browser/app/docker/docker-compose.yaml 后执行 fnpack build"
