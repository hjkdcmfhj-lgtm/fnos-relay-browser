name: Release fpk

# 推送 v* tag 时：分别构建 amd64 / arm64 原生镜像，再合并 multi-arch manifest 推送到 GHCR
# 使用：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号（去掉 v 前缀）
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.platform }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
            ${{ env.IMAGE_BASE }}:latest-${{ matrix.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 解析版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }} \
            -t ${{ env.IMAGE_BASE }}:latest \
            ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}-amd64 \
            ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}-arm64

      - name: 输出提示
        run: |
          echo "✅ 镜像已推送：${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}"
          echo "请将该地址填入 scripts/fpk/relay-browser/app/docker/docker-compose.yaml 后执行 fnpack build"
